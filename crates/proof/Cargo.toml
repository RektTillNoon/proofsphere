[package]
name = "proofsphere-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
prove = ["risc0-zkvm/prove", "dep:proofsphere-methods", "dep:libc"]

[dependencies]
proofsphere-model = { workspace = true, features = ["json"] }
risc0-zkvm.workspace = true
bincode = "=1.3.3"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
getrandom = "=0.3.4"
tempfile = "=3.27.0"
libc = { version = "=0.2.190", optional = true }
proofsphere-methods = { path = "../../methods", optional = true }

[dev-dependencies]
proofsphere-runner.workspace = true
hex.workspace = true
serde_json.workspace = true
